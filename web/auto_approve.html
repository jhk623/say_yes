<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>auto-yes-bot — 자동 승인 목록</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>자동 승인 목록</h1>
    <button id="settingsBtn" aria-label="설정">⚙</button>
  </header>

  <section id="settingsPanel" class="panel hidden">
    <h2>설정 (이 기기에만 저장됩니다)</h2>
    <label>ntfy 서버<input id="cfgServer" placeholder="https://ntfy.sh" /></label>
    <label>토픽 접두사<input id="cfgPrefix" placeholder="예: abcd1234..." /></label>
    <label>비밀키 (HMAC secret)<input id="cfgSecret" type="password" /></label>
    <button id="saveSettings">저장하고 연결</button>
    <p class="hint">relay.yaml에 설정한 topic_prefix / hmac_secret과 동일해야 합니다.
    메인 페이지에서 이미 설정했다면 여기서도 자동으로 불러옵니다.</p>
  </section>

  <section id="statusBar" class="statusbar">연결 대기 중...</section>

  <main>
    <section>
      <h2>세션별 자동 승인 상태</h2>
      <p class="hint">서버(hubble/heart3 등)마다 세션이 따로 등록되며, 여기서 켜고 끌 수 있습니다.</p>
      <ul id="sessionList" class="session-list"></ul>
    </section>
  </main>

  <p class="hint"><a href="index.html">← 메인 페이지(승인 대기)로 돌아가기</a></p>

  <script src="auto_approve.js"></script>
</body>
</html>
